allprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "io.github.libxposed" &&
                    details.requested.name in ["api", "interface", "service"]) {
                details.useVersion("101.0.0")
                details.because("minApiVersion=101 requires source-level compatibility")
            }
        }
    }
}
