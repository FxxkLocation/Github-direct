name: Android verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android build packages
        run: >-
          sdkmanager
          "platforms;android-37.0"
          "build-tools;37.0.0"
          "ndk;28.2.13676358"
          "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Verify changed-line whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}"; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Verify libxposed API 101 compatibility
        run: >-
          ./gradlew compileDebugJavaWithJavac
          --init-script gradle/verify-libxposed-101.init.gradle
          --stacktrace --no-daemon

      - name: Test, lint, and verify release APK
        run: ./gradlew testDebugUnitTest lintDebug verifyXposedReleaseApk --stacktrace --no-daemon
